<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 | 미래안전연구원</title><style>
:root{--navy:#0b2340;--blue:#0d63c9;--text:#17283c;--muted:#68798d;--line:#dce6ef;--bg:#f3f7fb;--danger:#c93838}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.shell{width:min(1180px,calc(100% - 30px));margin:30px auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.topbar img{width:190px}.topbar a{font-size:13px;font-weight:800;color:var(--blue)}.login,.workspace{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px rgba(13,53,88,.07)}.login{width:min(460px,100%);margin:70px auto;padding:34px}.login h1{font-size:27px;margin:0 0 8px}.hint{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:20px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #cfdbe7;border-radius:9px;padding:11px 12px;background:#fff}.field textarea{min-height:180px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:white}.btn.light{background:#edf4fb;color:#23496f}.btn.danger{background:#fff0f0;color:var(--danger)}.login .btn{width:100%}.status{margin-top:14px;font-size:13px;color:#52677d}.workspace{display:none;overflow:hidden}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:#f8fbfe}.tab{padding:15px 20px;border:0;background:transparent;font-weight:900;cursor:pointer}.tab.active{background:#fff;color:var(--blue);border-bottom:3px solid var(--blue)}.content{display:grid;grid-template-columns:420px 1fr;min-height:620px}.editor{padding:25px;border-right:1px solid var(--line)}.list{padding:25px}.row{display:grid;grid-template-columns:1fr 92px 100px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e8eef4}.row .title{font-weight:800}.row .date{font-size:12px;color:#8290a0}.row-actions{display:flex;gap:6px}.row-actions button{border:0;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:12px;font-weight:800}.row-actions .edit{background:#edf5ff;color:#0d63c9}.row-actions .del{background:#fff0f0;color:#c33}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.mode{background:#fff7d6;border:1px solid #f0df9b;color:#6f5a00;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:18px}.mode strong{display:block;margin-bottom:3px}.file-note{font-size:12px;color:#78899a;margin-top:5px}@media(max-width:900px){.content{grid-template-columns:1fr}.editor{border-right:0;border-bottom:1px solid var(--line)}.row{grid-template-columns:1fr}.row-actions{margin-top:3px}}
</style></head><body><div class="shell"><div class="topbar"><img src="로고2(2).jpg" alt="미래안전연구원"><a href="index.html">홈페이지 보기 →</a></div><section class="login" id="loginBox"><h1>관리자 로그인</h1><p class="hint" id="loginHint">공지사항과 자료실을 관리합니다.</p><div class="field"><label>관리자 이메일</label><input id="email" type="email" placeholder="admin@example.com"></div><div class="field"><label>비밀번호</label><input id="password" type="password" placeholder="비밀번호"></div><button class="btn primary" id="loginBtn">로그인</button><div class="status" id="loginStatus"></div></section><section class="workspace" id="workspace"><div class="tabs"><button class="tab active" data-cat="notice">공지사항 관리</button><button class="tab" data-cat="resource">자료실 관리</button><button class="tab" id="logoutBtn" style="margin-left:auto">로그아웃</button></div><div class="content"><div class="editor"><div class="mode" id="modeBox"></div><input id="editId" type="hidden"><div class="field"><label>제목</label><input id="title" maxlength="150" placeholder="제목을 입력하세요"></div><div class="field"><label>내용</label><textarea id="body" placeholder="내용을 입력하세요"></textarea></div><div class="field"><label>첨부파일</label><input id="file" type="file"><div class="file-note" id="fileNote">필요한 경우 PDF, 한글, 엑셀 등 파일을 첨부할 수 있습니다.</div></div><div class="field"><label><input id="published" type="checkbox" checked style="width:auto;margin-right:6px">홈페이지에 공개</label></div><div class="toolbar"><button class="btn primary" id="saveBtn">등록하기</button><button class="btn light" id="resetBtn">새 글</button></div><div class="status" id="saveStatus"></div></div><div class="list"><h2 id="listTitle" style="margin-top:0">공지사항 목록</h2><div id="rows"></div></div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script src="admin.js"></script></body></html>
